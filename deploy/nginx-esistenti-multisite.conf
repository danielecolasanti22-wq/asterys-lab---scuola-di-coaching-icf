# Direttive nginx GIÀ PRESENTI su Plesk per asteryslab.com — copia di riferimento.
# Rilevate il 11/08/2026 in: Domini > asteryslab.com > Apache & nginx Settings.
#
# ⛔ SONO LE REGOLE CHE FANNO FUNZIONARE IL MULTISITO. Reggono /inner (login, Lab,
# ordini), /forms, /office e /2025. Se il campo in Plesk viene sovrascritto senza
# rimetterle, quei siti smettono di rispondere all'istante.
#
# Il file generato (nginx-asteryslab.conf) le include già, in fondo: si incolla quello
# e queste tornano al loro posto insieme ai rimandi.
#
# Nota su come funzionano, perché è il motivo per cui il sito nuovo ci convive bene:
# la parte finale dice "se il file richiesto non esiste sul disco, passa a WordPress".
# Quindi un indirizzo che corrisponde a un file del sito nuovo viene servito come file,
# e tutto il resto continua ad andare a WordPress senza che si debba elencare nulla.

rewrite ^/([_0-9a-zA-Z-]+)/wp-admin$ /$1/wp-admin/index.php;
rewrite ^/([_0-9a-zA-Z-]+)/wp-admin/$ /$1/wp-admin/index.php;
rewrite ^/([_0-9a-zA-Z-]+)/((wp-(?:content|includes|admin)).*)$ /$2 break;
if ($request_uri !~ "^/(wp-(?:content|includes|admin)).*") {
    rewrite ^/([_0-9a-zA-Z-]+)/(.*.php)$ /$2 break;
}
set $test "";
if (!-e $request_filename) {
    set $test P;
}
if ($uri !~ ^/(plesk-stat|webstat|webstat-ssl|ftpstat|anon_ftpstat|awstats-icon|external-nginx-static-location)) {
    set $test "${test}C";
}
if ($test = PC) {
    rewrite ^/.*$ /index.php;
}
