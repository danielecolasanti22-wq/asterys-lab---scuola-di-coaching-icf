# --- 3. CACHE DEGLI ASSET ---------------------------------------------------
# Solo i file del sito nuovo: hanno l'impronta nel nome e non cambiano mai.
# Le immagini di WordPress (/wp-content/uploads) restano fuori di proposito,
# perche' li' i file vengono sostituiti mantenendo lo stesso nome.
location ^~ /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
}

# --- 4. CHI RISPONDE ---------------------------------------------------------
# L'ordine e' quello che rende l'operazione reversibile e a prova di svista:
#   1. c'e' un file con questo nome fra quelli del sito nuovo?  -> lo servo
#   2. c'e' una cartella con dentro index.html?                 -> la servo
#   3. in tutti gli altri casi                                  -> WordPress
#
# Il terzo punto e' la rete di sicurezza: /inner, /wp-admin, gli altri sottositi
# e ogni indirizzo non previsto finiscono a WordPress come oggi. Se domani
# aggiungi un sottosito, funziona senza toccare nulla di tutto questo.
location / {
    try_files $uri $uri/index.html @wordpress;
}

location @wordpress {
    try_files $uri $uri/ /index.php?$args;
}

# --- SE PLESK RIFIUTA IL BLOCCO QUI SOPRA -----------------------------------
# Plesk genera gia' una sua "location /". Se al momento di applicare compare un
# errore tipo "duplicate location", vuol dire che le due si pestano i piedi:
# cancella le ultime due sezioni e usa queste al loro posto. Fanno la stessa
# cosa, ma elencando le sezioni del sito nuovo invece di ridefinire la radice.
# (In questo caso la home va gestita a parte, con "location = /".)
#
# location = / {
#     try_files /index.html =404;
# }
# location ~ ^/(corsi|blog|eventi|aziende|about|iscriviti|personal-coaching|scuola-di-coaching-|privacy|cookie|termini|borsa-di-studio|credito-ai-talenti)(/|$) {
#     try_files $uri $uri/index.html /index.html;
# }
#
# NB: nessuna delle due varianti tocca /inner, /wp-admin o gli altri sottositi.
