# Asterys Lab — vetrina statica + area riservata WordPress sullo stesso dominio
# GENERATO DA scripts/nginx-plesk.mjs — rigenera con: npm run nginx
#
# Da incollare in Plesk:
#   Domini > asteryslab.com > Apache & nginx Settings > Additional nginx directives
# ============================================================================

# --- 1. IL PRINCIPIO ---------------------------------------------------------
# asteryslab.com e' un WordPress MULTISITO: la vetrina e' solo uno dei siti, e
# accanto vivono /inner (area riservata, login e Lab) e altri sottositi, tutti
# serviti dallo stesso WordPress installato nella cartella principale.
#
# Per questo la vetrina non va sostituita cancellando nulla: i file del sito
# nuovo si affiancano a WordPress, e nginx decide caso per caso chi risponde.
#
# La regola in fondo (punto 4) e' scritta per essere PRUDENTE: serve un file del
# sito nuovo solo se quel file esiste davvero, altrimenti passa la richiesta a
# WordPress. Cosi' /inner, la bacheca, gli altri sottositi e qualunque indirizzo
# che non abbiamo previsto continuano a funzionare da soli, senza doverli
# elencare qui uno per uno.

